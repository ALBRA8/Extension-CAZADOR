      "priceCurrency": "EUR",
      "price": 79.90,
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.2",
    }
  }
  </script>
  <!-- Segundo bloque JSON-LD también roto (otro tipo de fallo) -->
  <script type="application/ld+json">
    { "@type": "BreadcrumbList", "itemListElement": [ {, } ] }
  </script>
</head>
